# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
envlist =
  docs
  py{27,34,38}-flake8
  py{27,34,38}-coverage
  py{26,27,33,34,36,37,38}
  py{26,27,33,34,36,37,38}-defusedxml
  pypy{27,36,37,38}
  pypy{27,36,37,38}-defusedxml

[testenv]
basepython =
  py26: python2.6
  py27: python2.7
  py33: python3.3
  py34: python3.4
  py36: python3.6
  py37: python3.7
  py38: python3.8
  pypy27: pypy
  pypy36: pypy3.6
  pypy37: pypy3.7
  pypy38: pypy3.8

commands =
  flake8: flake8 pydocx
  coverage: nosetests --with-doctest --with-coverage --cover-package pydocx []
  !flake8-!coverage: nosetests --with-doctest []
deps =
  !flake8: -rrequirements/testing-base.txt
  defusedxml: defusedxml==0.4.1; python_version < "3.6"
  defusedxml: defusedxml==0.7.1; python_version >= "3.6"
  flake8: flake8==3.3.0; python_version < "3.8"
  flake8: flake8==3.8.4; python_version >= "3.8"
  coverage: coverage==3.6; python_version < "3.8"
  coverage: coverage==5.5; python_version >= "3.8"
  py26: importlib

[testenv:docs]
basepython = python3.6
commands =
  sphinx-build -W -b html -d {envtmpdir}/doctrees docs docs/_build/html
deps = -rrequirements/docs.txt
skipsdist = True
