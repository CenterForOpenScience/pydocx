name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  legacy:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "2.6"
            image: cronosmobi/python2.6
          - python-version: "3.3"
            image: python:3.3-slim
          - python-version: "3.4"
            image: python:3.4-slim

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v1
      - name: Check python version
        run: python --version
      - run: curl --version || true
      - run: wget --version || true
      - name: Ensure wget is installed
        run: command -v wget >/dev/null 2>&1 || { apt-get update && apt-get install -y wget; }
      - name: Download dependencies
        run: wget -i requirements/python-${{ matrix.python-version }}.txt
      - name: Install dependencies
        run: |
          pip install --no-index *.whl *.tar.gz
          if [ "${{ matrix.python-version }}" = "2.6" ]; then
            pip install --no-index importlib-1.0.4.zip
          fi
      - name: Install PyDocX
        run: pip install -e .
      - name: Run tests
        run: nosetests --with-doctest

  main:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "2.7"
            image: python:2.7-slim
          - python-version: "3.6"
            image: python:3.6-slim
          - python-version: "3.7"
            image: python:3.7-slim
          - python-version: "3.8"
            image: python:3.8-slim

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check python version
        run: python --version
      - name: Install dependencies
        run: pip install --requirement requirements/testing-base.txt
      - name: Install PyDocX
        run: pip install -e .
      - name: Run tests
        run: nosetests --with-doctest


  pep8:
    name: pep8 (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "2.7"
            image: python:2.7-slim
          - python-version: "3.4"
            image: python:3.4-slim
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: pip install flake8==3.3.0
      - run: flake8 pydocx

  coverage:
    name: coverage (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "2.7"
            image: python:2.7-slim
          - python-version: "3.4"
            image: python:3.4-slim
    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: pip install --requirement requirements/testing-base.txt coverage==3.6
      - name: Install PyDocX
        run: pip install -e .
      - run: nosetests --with-doctest --with-coverage --cover-package pydocx

  docs:
    name: docs
    runs-on: ubuntu-latest
    container:
      image: python:3.8-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install docs dependencies
        run: pip install --requirement requirements/docs.txt
      - name: Build docs (warnings as errors)
        run: sphinx-build -W -b html -d /tmp/doctrees docs docs/_build/html
